name: CD → Azure Container Apps

on:
  push:
    branches: [main]

env:
  ACR_NAME: triageregistry2026
  IMAGE: triageregistry2026.azurecr.io/triage-api
  ACA_APP: triage-api-app
  ACA_ENV: triage-env
  ACA_RG: triage-rg

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v

  # ── 2. Build & Deploy ────────────────────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      # Deploy using az CLI directly — avoids the action's --replace-env-vars bug.
      # Branches on whether the app already exists:
      #   First run  → az containerapp create  (defines secrets + env vars together)
      #   Subsequent → az containerapp secret set + update (only bumps the image)
      - name: Deploy to Azure Container Apps
        run: |
          FULL_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"

          if az containerapp show \
               --name ${{ env.ACA_APP }} \
               --resource-group ${{ env.ACA_RG }} \
               --output none 2>/dev/null; then

            echo "ℹ️  Container App exists — updating secrets and image..."

            az containerapp secret set \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --secrets \
                gemini-key="${{ secrets.GOOGLE_API_KEY }}" \
                qdrant-url="${{ secrets.QDRANT_URL }}" \
                qdrant-api-key="${{ secrets.QDRANT_API_KEY }}" \
                allowed-api-keys="${{ secrets.ALLOWED_API_KEYS }}" \
                langsmith-api-key="${{ secrets.LANGSMITH_API_KEY }}"

            az containerapp update \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --image "$FULL_IMAGE" \
              --set-env-vars \
                APP_ENV=production \
                VECTOR_BACKEND=qdrant \
                QDRANT_URL=secretref:qdrant-url \
                QDRANT_API_KEY=secretref:qdrant-api-key \
                GOOGLE_API_KEY=secretref:gemini-key \
                ALLOWED_API_KEYS=secretref:allowed-api-keys \
                LANGSMITH_API_KEY=secretref:langsmith-api-key \
                LANGSMITH_PROJECT=MJM \
                MCP_ENABLED=true

          else

            echo "🆕  Container App not found — creating from scratch..."

            az containerapp create \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --environment ${{ env.ACA_ENV }} \
              --image "$FULL_IMAGE" \
              --ingress external \
              --target-port 8000 \
              --min-replicas 1 \
              --max-replicas 3 \
              --secrets \
                gemini-key="${{ secrets.GOOGLE_API_KEY }}" \
                qdrant-url="${{ secrets.QDRANT_URL }}" \
                qdrant-api-key="${{ secrets.QDRANT_API_KEY }}" \
                allowed-api-keys="${{ secrets.ALLOWED_API_KEYS }}" \
                langsmith-api-key="${{ secrets.LANGSMITH_API_KEY }}" \
              --env-vars \
                APP_ENV=production \
                VECTOR_BACKEND=qdrant \
                QDRANT_URL=secretref:qdrant-url \
                QDRANT_API_KEY=secretref:qdrant-api-key \
                GOOGLE_API_KEY=secretref:gemini-key \
                ALLOWED_API_KEYS=secretref:allowed-api-keys \
                LANGSMITH_API_KEY=secretref:langsmith-api-key \
                LANGSMITH_PROJECT=MJM \
                MCP_ENABLED=true

          fi

          echo "✅ Deployed: $FULL_IMAGE"