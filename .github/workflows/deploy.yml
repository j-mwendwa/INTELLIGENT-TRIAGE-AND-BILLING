name: CD → Azure Container Apps

on:
  push:
    branches: [main]

env:
  ACR_NAME: triageregistry2026
  IMAGE: triageregistry2026.azurecr.io/triage-api
  ACA_APP: triage-api-app
  ACA_ENV: triage-env
  ACA_RG: triage-rg

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v

  # ── 2. Build & Deploy ────────────────────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      # Pre-flight: fail fast with a clear message if any required secret is unset.
      # GitHub expands unset secrets to empty strings — ACA then rejects them with
      # a cryptic "value should be provided" error. This catches it early.
      - name: Validate required secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ALLOWED_API_KEYS: ${{ secrets.ALLOWED_API_KEYS }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          MISSING=()
          [ -z "$GOOGLE_API_KEY"   ] && MISSING+=("GOOGLE_API_KEY")
          [ -z "$QDRANT_URL"       ] && MISSING+=("QDRANT_URL")
          [ -z "$QDRANT_API_KEY"   ] && MISSING+=("QDRANT_API_KEY")
          [ -z "$ALLOWED_API_KEYS" ] && MISSING+=("ALLOWED_API_KEYS")
          [ -z "$LANGSMITH_API_KEY"] && MISSING+=("LANGSMITH_API_KEY")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing GitHub Actions secrets: ${MISSING[*]}"
            echo "   Go to: Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          echo "✅ All required secrets are present."

      # Deploy using az CLI directly — avoids the action's --replace-env-vars bug.
      # Also handles ACR registry credentials (admin account) for image pulls.
      # Branches on whether the app already exists:
      #   First run  → az containerapp create  (defines secrets + env-vars + registry)
      #   Subsequent → az containerapp secret set + registry set + update
      - name: Deploy to Azure Container Apps
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ALLOWED_API_KEYS: ${{ secrets.ALLOWED_API_KEYS }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          FULL_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"

          # Build the secrets string once — ACA expects "name=value" space-separated.
          SECRETS_ARGS="gemini-key=$GOOGLE_API_KEY qdrant-url=$QDRANT_URL qdrant-api-key=$QDRANT_API_KEY allowed-api-keys=$ALLOWED_API_KEYS langsmith-api-key=$LANGSMITH_API_KEY"

          ENV_VARS="APP_ENV=production VECTOR_BACKEND=qdrant QDRANT_URL=secretref:qdrant-url QDRANT_API_KEY=secretref:qdrant-api-key GOOGLE_API_KEY=secretref:gemini-key ALLOWED_API_KEYS=secretref:allowed-api-keys LANGSMITH_API_KEY=secretref:langsmith-api-key LANGSMITH_PROJECT=MJM MCP_ENABLED=true"

          # Fetch ACR admin credentials for registry authentication
          ACR_USER=${{ env.ACR_NAME }}
          ACR_PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.ACA_RG }} --query "passwords[0].value" -o tsv)

          if az containerapp show \
               --name ${{ env.ACA_APP }} \
               --resource-group ${{ env.ACA_RG }} \
               --output none 2>/dev/null; then

            echo "ℹ️  Container App exists — updating secrets, registry, and image..."

            az containerapp secret set \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --secrets $SECRETS_ARGS

            az containerapp registry set \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --server ${{ env.IMAGE }} \
              --username "$ACR_USER" \
              --password "$ACR_PASS"

            az containerapp update \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --image "$FULL_IMAGE" \
              --set-env-vars $ENV_VARS

          else

            echo "🆕  Container App not found — creating from scratch..."

            az containerapp create \
              --name ${{ env.ACA_APP }} \
              --resource-group ${{ env.ACA_RG }} \
              --environment ${{ env.ACA_ENV }} \
              --image "$FULL_IMAGE" \
              --registry-server ${{ env.IMAGE }} \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --ingress external \
              --target-port 8000 \
              --min-replicas 1 \
              --max-replicas 3 \
              --secrets $SECRETS_ARGS \
              --env-vars $ENV_VARS

          fi

          echo "✅ Deployed: $FULL_IMAGE"