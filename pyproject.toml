[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "intelligent-triage-billing"
version = "0.1.0"
description = "Intelligent Triage & Billing — Hierarchical multi-agent RAG system with LangGraph + FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # LlamaIndex
    "llama-index>=0.12.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    # Vector stores
    "chromadb>=0.5.0",
    "qdrant-client>=1.11.0",
    # Configuration & security
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    # Logging & observability
    "structlog>=24.1.0",
    "langsmith>=0.1.0",
    # Token counting
    "tiktoken>=0.7.0",
    # MCP
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
]
e2e = [
    "playwright>=1.45.0",
    "pytest-playwright>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external API keys",
    "e2e: end-to-end browser tests",
]
